# Pushing a v* tag builds every platform with scripts/package.sh and publishes
# the GitHub Release with the archives attached. A tag containing "-" is a
# prerelease: it is published as a GitHub prerelease and the tap is left alone.
# Artifact names, the Cask and the update contract follow
# https://github.com/soundadam/appkit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: The binary reports the tag's version
        run: |
          version=${GITHUB_REF_NAME#v}
          tar -xzf "dist/facet-$version-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/facet-$version-linux-x86_64/facet" version)" = "facet $version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # The release is immutable once published, so the archives go up with its
  # creation: gh uploads them to a draft and publishes it afterwards.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case $GITHUB_REF_NAME in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${prerelease[@]}"

  # Fills packaging/homebrew/facet.rb with the version and the SHA-256 of each
  # archive and pushes it to the main branch of soundadam/homebrew-tap.
  # HOMEBREW_TAP_GITHUB_TOKEN: fine-grained token with Contents read and write
  # on soundadam/homebrew-tap only; the workflow's own token cannot push there.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Render the Cask
        run: |
          version=${GITHUB_REF_NAME#v}
          sha() { sha256sum "dist/facet-$version-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$version/" \
            -e "s/@MACOS_AARCH64_SHA256@/$(sha macos-aarch64)/" \
            -e "s/@MACOS_X86_64_SHA256@/$(sha macos-x86_64)/" \
            -e "s/@LINUX_AARCH64_SHA256@/$(sha linux-aarch64)/" \
            -e "s/@LINUX_X86_64_SHA256@/$(sha linux-x86_64)/" \
            packaging/homebrew/facet.rb >facet.rb
          ! grep -n '@[A-Z0-9_]*@' facet.rb

      - name: Push to soundadam/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set"; exit 1; }
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/soundadam/homebrew-tap.git" tap
          cp facet.rb tap/Casks/facet.rb
          cd tap
          git add Casks/facet.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "facet ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
