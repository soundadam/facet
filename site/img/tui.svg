<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" role="img" aria-labelledby="facet-tui-title">
  <title id="facet-tui-title">facet's terminal interface: three profiles with their proxies and time zones, and the selected profile's fingerprint settings below</title>
  <defs>
